server.port=${SERVER_PORT:28242}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bipLoad}
spring.datasource.username=${MYSQL_USER:bip}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.generate-ddl=false
spring.jpa.show-sql=true

# --- Actuator (added by devsecops-architect) ---
# Health probes power the container HEALTHCHECK and K8s liveness/readiness.
# Prometheus endpoint feeds the observability stack. show-details=never avoids
# leaking internals to anonymous callers.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
