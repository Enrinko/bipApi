name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege by default; individual jobs opt into more if they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest
    # The single @SpringBootTest boots the full context, which (ddl-auto=update) opens a
    # real DB connection — so CI needs a MySQL to talk to.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bipLoad
          MYSQL_USER: bip
          MYSQL_PASSWORD: testpassword
          MYSQL_ROOT_PASSWORD: testrootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestrootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    defaults:
      run:
        working-directory: MyPractice
    env:
      MYSQL_USER: bip
      MYSQL_PASSWORD: testpassword
      # allowPublicKeyRetrieval lets Connector/J 8.0.28 auth against MySQL 8.4's
      # caching_sha2_password over the plaintext CI link.
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/bipLoad?allowPublicKeyRetrieval=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build & test (against MySQL service)
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Dependency scan (trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: MyPractice
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # exit-code 0 = report-only. This app runs EOL Spring Boot 2.6.7, which carries
          # known CVEs that are only fixed by upgrading the framework — failing here would
          # keep CI permanently red. Documented override (see SECURITY.md). Flip to "1"
          # after moving to a supported Spring Boot line.
          exit-code: "0"

  hadolint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: MyPractice/Dockerfile
          failure-threshold: warning
