global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: dev
    service: bipapi

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: bipapi
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:28242"]
